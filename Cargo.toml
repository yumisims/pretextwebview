[package]
name = "egui_pretextview"
version = "0.1.0"
edition = "2021"
description = "egui interface for a PretextView-style Hi-C contact map viewer"
publish = false

[dependencies]
eframe = "0.31"
ehttp = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Request",
    "Response",
    "Window",
] }

[profile.release]
opt-level = 2
codegen-units = 1
